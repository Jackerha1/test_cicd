# Dogfood — the AI-CICD pipeline reviews its own PRs.
#
# v2 architecture (webhook-based, NO ANTHROPIC_API_KEY in CI):
#   This workflow does NOT run the pipeline in the GitHub Action runner.
#   Instead, the GitHub webhook (configured at repo Settings → Webhooks)
#   POSTs the pull_request event directly to the maintainer's local
#   pipeline server (exposed via cloudflared tunnel). The pipeline runs
#   on the maintainer's host using the local claude + gemini CLIs (with
#   their OAuth tokens — no portable API keys needed).
#
# What THIS workflow does (only):
#   - On PR open/sync, post a single "review queued" comment so authors
#     know the local pipeline will respond. The real review comment
#     arrives separately from the local pipeline (via gh CLI).
#
# Configuration on the repo side:
#   1. Settings → Webhooks → Add:
#        Payload URL:  https://<your-cloudflared-url>/event/github
#        Content type: application/json
#        Secret:       <AICICD_WEBHOOK_SECRET on host>
#        Events:       Pull requests, Issues, Issue comments
#
# Branch policy: this workflow ONLY fires for PRs targeting `develop`.
# `main` is sacred — the pipeline reviews develop work, not pipeline code.

name: AI-CICD PR Review (dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-cicd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hand-off-to-local-pipeline:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post pending-review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- ai-cicd-pending -->'
          BODY="$MARKER
          🤖 **AI-CICD review queued**

          The local pipeline (running on maintainer's host) will fetch this
          PR's diff via webhook and post a full agent review within ~1–3 min.

          - 9 specialist agents (triage, security_scan, code_review, …)
          - Provider stack: gemini-default + claude-critic (different family)
          - This pending notice will be replaced by the real review comment.

          If no review appears within 5 min, the maintainer's local pipeline
          may be offline — ping them."

          # --paginate: walk all pages so the marker is found even on
          # long-discussion PRs (default page size is 30). Addresses
          # code_review feedback on PR #1 (pipe-298721cf).
          existing=$(gh api --paginate repos/$REPO/issues/$PR/comments \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH repos/$REPO/issues/comments/$existing -f body="$BODY"
          else
            gh pr comment $PR --repo $REPO --body "$BODY"
          fi
