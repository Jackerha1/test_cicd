# Dogfood — the AI-CICD pipeline reviews its own PR.
#
# Karpathy reflex: "use your own product first." If our system can't review
# its own PRs, why should anyone trust it on theirs.
#
# Skips silently when ANTHROPIC_API_KEY isn't set, so forks / draft PRs from
# external contributors don't fail spuriously.

name: AI-CICD PR Review (dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One run per PR; cancel previous if a new commit lands.
concurrency:
  group: ai-cicd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip on PRs from forks (no access to secrets) and skip if no API key.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check secret presence
        id: secret_check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — skipping LLM review."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret_check.outputs.has_key == 'true'

      # ---------- Toolchain ----------
      - uses: actions/setup-node@v4
        if: steps.secret_check.outputs.has_key == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.secret_check.outputs.has_key == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Claude CLI
        if: steps.secret_check.outputs.has_key == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install pipeline + gateway deps
        if: steps.secret_check.outputs.has_key == 'true'
        run: |
          pip install -e .
          pip install fastapi "uvicorn[standard]" python-dotenv websockets

      # ---------- Gateway ----------
      - name: Start claude-cli-api gateway
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd claude-cli-api
          PORT=8200 PLANNER_BACKEND=claude nohup python main.py > /tmp/gateway.log 2>&1 &
          # Wait until /healthz is alive (max 30s)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8200/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8200/healthz || (cat /tmp/gateway.log; exit 1)

      # ---------- Pipeline ----------
      - name: Build PR event
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_pr_event.py > /tmp/event.json

      - name: Run pipeline
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CLI_API_URL: http://localhost:8200
          AICICD_FORCE_PROVIDER: claude       # CI lane: claude only (no Gemini auth in CI)
          AUTO_APPROVE: "true"                 # no human in CI to approve
          AICICD_PIPELINE_BUDGET_USD: "0.50"   # tighter than prod default of $1
          CLAUDE_CALL_TIMEOUT: "300"
        run: |
          # `|| true` — we still want to post the result even if pipeline blocks.
          ai-cicd run /tmp/event.json || true

      - name: Post review comment
        if: steps.secret_check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/post_pr_review.py

      - name: Upload audit + result artifacts
        if: steps.secret_check.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-cicd-pipeline-${{ github.event.pull_request.number }}
          path: |
            logs/
            data/runs/
          if-no-files-found: warn
          retention-days: 14

      # If the pipeline returned `blocked` we want CI red — but the comment is
      # already up so reviewers see the why before they see the red ✗.
      - name: Reflect verdict to CI status
        if: steps.secret_check.outputs.has_key == 'true'
        run: |
          latest=$(ls -t logs/pipe-*.json 2>/dev/null | head -1)
          if [ -z "$latest" ]; then
            echo "no pipeline result found"; exit 0
          fi
          status=$(python -c "import json,sys;print(json.load(open('$latest'))['final_status'])")
          echo "Pipeline final_status=$status"
          case "$status" in
            approved|needs_human) exit 0 ;;
            *)                    exit 1 ;;
          esac
