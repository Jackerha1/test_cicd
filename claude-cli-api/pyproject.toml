[project]
name = "claude-cli-api"
version = "1.0.0"
description = "Standalone FastAPI wrapper around the Claude CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
