# Risk classification rules — deterministic, evaluated before any agent.
#
# Two match dimensions (rules can use either or both):
#   match.paths          — file globs (fnmatch)
#   match.diff_contains  — regex patterns evaluated against the unified diff
#                          (used to spot dangerous CODE PATTERNS, not just paths)
#
# When both are present, BOTH must match (path AND content).
# When only diff_contains is present, content match alone fires the rule.
#
# Karpathy reflex: when AI keeps catching the same bug pattern across
# multiple PRs, promote it here so it's caught BEFORE we spend any AI tokens.
# This is the "data flywheel closed" — Reflector suggests, you commit, future
# attacks hit the cheap deterministic gate.

rules:
  # ---- Promoted from Reflector suggestion (pipeline pipe-d58abf94) ----
  - id: jwt_none_bypass
    match:
      paths:
        - "src/auth/**"
        - "**/auth/**"
        - "**/jwt*"
        - "**/session*"
        - "**/token*"
      diff_contains:
        # Block any diff that adds 'none' to JWT algorithms list.
        # Catches: algorithms=['RS256','none']  algorithms=["none"]  alg='none', etc.
        - "algorithms\\s*=\\s*\\[[^\\]]*['\"]none['\"]"
        - "['\"]alg['\"]\\s*:\\s*['\"]none['\"]"
        - "\\balg\\s*=\\s*['\"]none['\"]"
    risk_level: critical
    require_human_approval: true
    block: true                          # hard block — no agent runs
    reason: "Diff enables JWT 'none' algorithm (CWE-347 — token forgery). Promoted from Reflector."

  - id: auth_payment_critical
    match:
      paths:
        # AI-CICD pipeline source (this repo's own auth/payment dirs).
        - "src/auth/**"
        - "src/payment/**"
        - "src/billing/**"
        - "src/permissions/**"
        # crud-demo target codebase — auth + JWT + password handling.
        - "crud-demo/backend/app/auth.py"
        - "crud-demo/backend/app/routes/auth.py"
        - "crud-demo/backend/tests/test_auth_routes.py"
        # generic catch-alls for any nested repo we may add later.
        - "**/auth/**"
        - "**/payment/**"
        - "**/billing/**"
    risk_level: critical
    require_human_approval: true
    reason: "Touches authentication, payment, or permissions surface."

  - id: ci_infra_high
    match:
      paths:
        - ".github/workflows/**"
        - ".gitlab-ci.yml"
        - "Dockerfile*"
        - "**/Dockerfile*"
        - "docker-compose*.yml"
        - "**/docker-compose*.yml"
        - "infra/**"
        - "deploy/**"
        - "Makefile"
        # crud-demo's deployment surface
        - "crud-demo/docker-compose.yml"
        - "crud-demo/backend/Dockerfile"
        - "crud-demo/frontend/Dockerfile"
    risk_level: high
    require_human_approval: true
    reason: "Touches CI/CD or deployment infrastructure."

  - id: dependency_high
    match:
      paths:
        - "package.json"
        - "**/package.json"
        - "package-lock.json"
        - "**/package-lock.json"
        - "pnpm-lock.yaml"
        - "yarn.lock"
        - "requirements*.txt"
        - "pyproject.toml"
        - "**/pyproject.toml"
        - "poetry.lock"
        - "Pipfile*"
        - "go.mod"
        - "go.sum"
        - "Cargo.toml"
        - "Cargo.lock"
    risk_level: high
    require_human_approval: true
    reason: "Modifies dependency manifest — supply-chain risk."

  - id: secrets_block
    match:
      paths:
        - ".env*"
        - "**/secrets/**"
        - "**/*.pem"
        - "**/*.key"
    risk_level: critical
    require_human_approval: true
    block: true
    reason: "Patch attempts to touch a secret-bearing file. Always blocked."

  - id: docs_low
    match:
      paths:
        - "**/*.md"
        - "docs/**"
        - "README*"
        - "CHANGELOG*"
    risk_level: low
    require_human_approval: false
    reason: "Docs-only change."

  - id: tests_low
    match:
      paths:
        - "tests/**"
        - "**/*_test.py"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.spec.ts"
    risk_level: low
    require_human_approval: false
    reason: "Test-only change."

# Default applied when no rule matches.
default:
  risk_level: medium
  require_human_approval: false
  reason: "Standard code change."
