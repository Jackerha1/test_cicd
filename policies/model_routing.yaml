# Per-agent provider routing — gemini-default deployment.
#
# Default = gemini for every agent EXCEPT the Critic, which stays on
# claude-family. Karpathy reflex: an independent judge must come from a
# DIFFERENT family than the producers it grades — uncorrelated errors.
# If we routed Critic to gemini too, it would be grading its own family's
# work and miss the same failure modes.
#
# Override at runtime:
#   AICICD_FORCE_PROVIDER=claude   ai-cicd run examples/...   # all agents → claude
#   AICICD_FORCE_PROVIDER=gemini   ai-cicd run examples/...   # all agents → gemini

default:
  provider: gemini
  model:    ""              # empty → CLI's own default

routing:
  # All producer / decision agents → gemini (the deployment default).
  triage:        {provider: gemini, model: ""}
  planner:       {provider: gemini, model: ""}
  bug_fix:       {provider: gemini, model: ""}
  test_writer:   {provider: gemini, model: ""}
  security_scan: {provider: gemini, model: ""}
  code_review:   {provider: gemini, model: ""}
  documentation: {provider: gemini, model: ""}
  validation:    {provider: gemini, model: ""}
  deployment:    {provider: gemini, model: ""}
  reflector:     {provider: gemini, model: ""}

  # ---- Independent judge (different family) ----
  critic:
    provider: claude
    model:    ""
    # If you flip Critic to gemini, Karpathy's "different-family judge"
    # invariant breaks. Add a CI gate before doing that.
