[project]
name = "ai-cicd"
version = "0.1.0"
description = "AI-Powered CI/CD with multi-agent pipeline (Triage, Planner, BugFix, TestWriter, SecurityScan, CodeReview, Documentation, Validation, Deployment)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "jsonschema>=4.21.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-cicd = "src.cli:app"

[tool.setuptools]
packages = ["src"]
