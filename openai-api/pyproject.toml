[project]
name = "openai-api"
version = "1.0.0"
description = "FastAPI wrapper around the OpenAI SDK, mirroring claude-cli-api/'s POST /chat contract"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openai>=1.40.0",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]
