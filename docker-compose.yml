# Production stack — single container.
#
# claude-cli-api gateway runs DIRECTLY ON HOST (managed by `make gateway` /
# `make gateway-stop`). The pipeline container reaches it via Docker
# Desktop's special DNS `host.docker.internal`, which resolves to the host
# from inside any container.
#
# Why host instead of container? The CLI binaries (claude / gemini) carry
# OAuth tokens that are bound to the host machine fingerprint. Mounting
# ~/.claude.json into a container does NOT make those tokens portable —
# they fail with "Not logged in". For local production we keep the auth on
# host where it actually works; for cloud production, swap host gateway
# for an instance with API-key auth.

services:
  pipeline:
    build:
      context: .
      dockerfile: deploy/Dockerfile.pipeline
    container_name: ai-cicd-pipeline
    restart: unless-stopped
    environment:
      - CLAUDE_CLI_API_URL=http://host.docker.internal:8200
      - WORKSPACE_DIR=/app/artifacts
      - AUDIT_DB_PATH=/app/logs/audit.db
      - SANDBOX_MODE=subprocess
      - MAX_AGENT_RETRIES=2
      - AUTO_APPROVE=false
      - AICICD_LOG_FORMAT=json
      - AICICD_WEBHOOK_SECRET=${AICICD_WEBHOOK_SECRET:-changeme-rotate-this}
      - AICICD_WORKER_CONCURRENCY=${AICICD_WORKER_CONCURRENCY:-2}
      - AICICD_PIPELINE_BUDGET_USD=${AICICD_PIPELINE_BUDGET_USD:-1.00}
      # Optional: force a single provider for ALL agents (testing / incident).
      - AICICD_FORCE_PROVIDER=${AICICD_FORCE_PROVIDER:-}
      - AICICD_FORCE_MODEL=${AICICD_FORCE_MODEL:-}
      # Real PR commenting + diff fetch. Without this, comment_pr is simulated
      # (writes to artifacts/<id>/comments.jsonl only). Set in .env from
      # `gh auth token` or a fine-grained PAT with pull-request: write.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    extra_hosts:
      # Linux Docker doesn't auto-create host.docker.internal — explicit map.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
      - ./data:/app/data
      - ./memory:/app/memory
      # Bind-mount policies / prompts so ops can iterate without a rebuild.
      - ./policies:/app/policies:ro
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Bind mounts only — host can `make audit` / `tail logs/audit.db` without exec.
